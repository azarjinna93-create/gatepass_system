# Production stack for AWS EC2.
# UI + API + Postgres all run on the same EC2 (no Neon required).
#
# Usage:
#   1. Copy .env.aws.example → .env.aws and fill in values
#   2. docker compose -f docker-compose.aws.yml --env-file .env.aws up -d --build
#   3. First time only — create tables + admin user:
#        docker compose -f docker-compose.aws.yml --env-file .env.aws exec api node scripts/setup.js
#        docker compose -f docker-compose.aws.yml --env-file .env.aws exec api node scripts/seed-users-only.js

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gatepass
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: gatepass
    volumes:
      - gatepass_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gatepass -d gatepass"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./gatepass-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PGSSL: ${PGSSL:-false}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
      PORT: "4000"
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PGSSL: ${PGSSL:-false}
      AUTH_SECRET: ${JWT_SECRET}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      PORT: "3000"
    ports:
      - "80:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  gatepass_pgdata:
